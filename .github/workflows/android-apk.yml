name: Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 defaults to the removed "tools" SDK package; request only platform-tools.
          packages: "platform-tools"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.1" "ndk;26.1.10909125"

      - name: Install JavaScript dependencies
        working-directory: app/client/mobile
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile --network-timeout 600000

      - name: Build standalone release APK
        working-directory: app/client/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon -PciDebugSigning=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: databag-offline-apk
          path: app/client/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
