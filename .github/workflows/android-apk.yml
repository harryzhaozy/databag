name: Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 defaults to the removed "tools" SDK package; request only platform-tools.
          packages: "platform-tools"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.1" "ndk;26.1.10909125"

      - name: Install JavaScript dependencies
        working-directory: app/client/mobile
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile --network-timeout 600000

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing Actions secret: ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing Actions secret: ANDROID_KEY_ALIAS" >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing Actions secret: ANDROID_KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing Actions secret: ANDROID_KEY_PASSWORD" >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/client/mobile/android/app/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/app/client/mobile/android/app/release.keystore" >> "$GITHUB_ENV"

      - name: Build standalone release APK
        working-directory: app/client/mobile/android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: databag-release-apk
          path: app/client/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
